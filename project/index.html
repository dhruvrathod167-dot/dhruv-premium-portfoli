    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    
    <!-- Theme color meta tags for both modes -->
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">

    <title>Dhruv — Python Full Stack Developer & AI Application Developer</title>
    <meta
      name="description"
      content="Python Full Stack Developer building modern web applications, APIs and AI-powered digital products with Django, FastAPI, React and modern AI technologies."
    />
    <link rel="canonical" href="https://dhruv.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dhruv — Python Full Stack Developer & AI Application Developer" />
    <meta
      property="og:description"
      content="Python Full Stack Developer building modern web applications, APIs and AI-powered digital products with Django, FastAPI, React and modern AI technologies."
    />
    <meta property="og:image" content="https://images.pexels.com/photos/30820142/pexels-photo-30820142.jpeg?auto=compress&cs=tinysrgb&w=1200" />
    <meta property="og:url" content="https://dhruv.dev/" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme initialization script -->
    <script>
      // Theme initialization - runs before page render
      (function() {
        // Check for saved theme preference or system preference
        const savedTheme = localStorage.getItem('portfolio-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // Determine initial theme
        const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        
        // Apply theme immediately to prevent flash
        if (initialTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"

  </head>
  <body>

  </body>
